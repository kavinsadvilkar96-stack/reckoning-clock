name: restructure
on: [push]
permissions:
  contents: write
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move files into folders
        run: |
          [ -f feeds.json ] || { echo organised; exit 0; }
          mkdir -p config docs/data docs/fonts scripts/lib scripts/test
          mv feeds.json config/
          mv index.html clock-core.js game-core.js game.js docs/
          mv state.json game.json countries-110m.json docs/data/
          mv archivo-latin-wdth-normal.woff2 LICENSE-Archivo.txt docs/fonts/
          mv update.mjs scripts/
          mv guard.mjs news.mjs parsers.mjs scripts/lib/
          mv fixtures.mjs mock-fetch.mjs unit.test.mjs update.test.mjs game.test.mjs scripts/test/
          cat > package.json <<'EOF'
          {
            "name": "reckoning-clock",
            "private": true,
            "description": "The Reckoning Clock: a public climate-risk map that updates every 15 minutes.",
            "scripts": {
              "update": "node scripts/update.mjs",
              "test": "node --test scripts/test/*.test.mjs"
            },
            "engines": { "node": ">=20" }
          }
          EOF
          cat > control.json <<'EOF'
          {
            "kill_switch": false,
            "reason": ""
          }
          EOF
          cat > manual.json <<'EOF'
          {
            "help": "Yearly inputs that no free daily feed supplies. Edit a value here and commit it; the next update uses it. Keep as_of and source accurate, because the page shows them.",
            "flow": {
              "value": 38.2,
              "unit": "billion tonnes of CO2 a year",
              "as_of": "2026-11-10",
              "source": "Global Carbon Budget 2026, projection for 2026",
              "url": "https://globalcarbonbudget.org/"
            },
            "policy": {
              "warming_2100_c": 2.7,
              "zero_c": 1.5,
              "midnight_c": 3.6,
              "as_of": "2026-11",
              "source": "Climate Action Tracker, warming under current policies (COP31 update)",
              "url": "https://climateactiontracker.org/",
              "rule": "A score of 0 means on track for 1.5 °C of warming by 2100. A score of 100 means on track for 3.6 °C, where current policies pointed in 2015."
            },
            "renewable_share_now_pct": {
              "value": 32,
              "as_of": "2024",
              "source": "Ember, Global Electricity Review 2025 (2024 data). Check and update."
            }
          }
          EOF
          git config user.name github-actions
          git config user.email actions@github.com
          git add -A
          git commit -m "Move files into folders and add missing root files"
          git push
